aid: lightricks
name: Lightricks
description: Lightricks is a Jerusalem-based creative-technology company behind the Facetune, Photoleap
  and Videoleap consumer apps and the LTX generative video platform. Its developer-facing product is the
  LTX API at api.ltx.video, a video-generation API covering text-to-video, image-to-video, audio-to-video,
  retake, extend, HDR upscale and reframe, offered in synchronous (v1) and asynchronous job-based (v2)
  forms and billed per second of output. Lightricks also publishes the LTX-2 and LTX-Video open-weight
  models, a ComfyUI node set and a LoRA trainer on GitHub under Apache-2.0.
