- name: LTX Model
  entries:
  - version: LTX-2.3
    date: '2026-03-05'
    title: LTX-2.3 22B Model, Native Audio, Portrait Video, Desktop Editor
    breaking: false
    additions:
    - 22-billion parameter architecture, upgraded from 19B
    - Synchronized audio and video generated in a single forward pass
    - Up to 4K resolution at 50 FPS, up to 20 seconds per clip
    - Native portrait (9:16) vertical video
    - 24 and 48 FPS output options; last-frame interpolation
    - Spatial and temporal upscalers; desktop video editor for local generation
    - 'LoRA adapters: Motion-Track-Control, Union-Control (depth/pose/canny), Detailer'
    highlights:
    - Redesigned high-fidelity VAE; reduced texture drift over longer sequences
    - Upgraded HiFi-GAN vocoder, stereo audio at 24 kHz
    - 4x larger text connector for better prompt adherence
    - Apache 2.0 license, fully open weights, commercial use allowed
  - version: LTX-2
    date: '2026-01-06'
    title: LTX-2 open-source release — full weights and codebase
    breaking: false
    additions:
    - Full open-weights release on Hugging Face and GitHub
    - Fast / Pro / Ultra model variants
    - Text-to-video, image-to-video, video-to-video, audio-to-video
    - Multi-input conditioning (text, image, video, audio, depth maps, reference video)
    - Keyframe interpolation pipeline; LoRA fine-tuning in under an hour
    highlights:
    - First production-ready audio-video generation model with truly open weights
    - Technical report published (arXiv 2601.03233)
    - HD through 4K output, up to 10 seconds at launch
